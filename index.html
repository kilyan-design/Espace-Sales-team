<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delthom Agency OS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .font-serif { font-family: 'DM Serif Display', serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(51, 65, 85, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(34, 211, 238, 0.5); }
        
        .hud-enter { opacity: 0; transform: translateY(15px); animation: hudEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes hudEnter { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Correction pour les inputs dates/heure en mode sombre */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }

        /* Styles de Session Calling */
        .game-wrapper .hl { background: rgba(34, 211, 238, 0.15); border-radius: 3px; padding: 1px 5px; color: #67e8f9; }
        .game-wrapper em { font-style: italic; color: #22d3ee; }
        .game-wrapper .pause { display: block; font-size: 13px; font-style: italic; color: #9ca3af; margin: 10px 0; font-weight: 300; }
        
        [draggable="true"] { cursor: grab; }
        [draggable="true"]:active { cursor: grabbing; }
    </style>
</head>
<body class="flex h-screen font-sans text-slate-100 overflow-hidden relative bg-[#0B0F19] selection:bg-cyan-500/30 selection:text-cyan-200">
    
    <!-- Background Design -->
    <div class="fixed inset-0 z-0 pointer-events-none bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/10 via-[#0B0F19] to-cyan-900/10"></div>

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#0B0F19] border-r border-[#1a1f2e] flex flex-col h-full flex-shrink-0 z-20 shadow-2xl relative">
        <div class="p-8 pb-4 flex items-center space-x-4 relative">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-cyan-400 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-[0_0_20px_rgba(56,189,248,0.4)]">W</div>
            <div>
                <h2 class="font-black text-white text-lg leading-tight uppercase tracking-tight">WEB_FORGE</h2>
                <p class="text-[10px] font-bold text-cyan-400 uppercase mt-0.5 tracking-widest flex items-center">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> Root Access
                </p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-4 space-y-1 custom-scrollbar flex flex-col" id="sidebar-nav">
            <!-- Rendu JS -->
        </nav>

        <div class="p-4 border-t border-[#1a1f2e] space-y-1">
           <button onclick="window.app.setTab('Paramètres')" class="w-full flex items-center space-x-4 px-4 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-[#111623] transition-all">
             <i data-lucide="settings" class="w-5 h-5 text-slate-500"></i>
             <span class="text-sm font-semibold tracking-wide">Paramètres</span>
           </button>
           <button class="w-full flex items-center space-x-4 px-4 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-[#111623] transition-all">
             <i data-lucide="log-out" class="w-5 h-5 text-slate-500"></i>
             <span class="text-sm font-semibold tracking-wide">Déconnexion</span>
           </button>
        </div>

        <div class="px-4 pb-6 pt-2">
           <div class="w-full flex items-center px-4 py-2.5 bg-[#151a2d] border border-[#212942] rounded-lg">
             <div class="w-2 h-2 rounded-full bg-emerald-400 mr-3 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div>
             <i data-lucide="flame" class="w-4 h-4 text-fuchsia-500 mr-2"></i>
             <span class="text-xs font-semibold text-slate-300">JARVIS en ligne</span>
           </div>
        </div>
    </aside>

    <!-- MAIN APP AREA -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative z-10 bg-[#050810]">
        
        <!-- HEADER -->
        <header class="h-16 border-b border-[#1a1f2e] flex items-center justify-between px-10 shrink-0">
            <div class="text-xs font-bold text-slate-500 flex items-center uppercase tracking-widest">
                SYS_LOC <i data-lucide="chevron-right" class="w-4 h-4 mx-2 text-slate-600"></i> 
                <span id="header-loc" class="text-cyan-400 font-black px-2 py-1 bg-cyan-500/10 border border-cyan-500/20 rounded-md">...</span>
            </div>
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2 bg-[#111623] px-3 py-1.5 rounded-lg border border-[#1a1f2e]">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Profil :</span>
                    <select id="role-selector" onchange="window.app.changeRole(this.value)" class="bg-transparent text-sm font-black text-cyan-400 outline-none cursor-pointer">
                        <option value="Admin" selected>Admin Supérieur</option>
                        <option value="Closer">Closer (Ventes)</option>
                        <option value="Setter">Setter (Appels)</option>
                    </select>
                </div>
                <button class="relative text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-pink-500 rounded-full shadow-[0_0_10px_rgba(236,72,153,0.8)]"></span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC CONTENT AREA -->
        <div id="app-content" class="flex-1 overflow-y-auto p-10 relative custom-scrollbar">
            <!-- Vues injectées via JS -->
        </div>
    </main>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container"></div>

    <!-- JAVASCRIPT APPLICATION LOGIC -->
    <script>
        const MOCK_DATA = {
            prospects: [
                { id: 1, name: "Oudot", company: "Point Fort Fichet", sector: "Artisanat", city: "Lyon", phone: "+33 6 32 21 56 91", email: "contact@oudot.fr", status: "Nouveau lead", initial: "O", assignee: 3, score: 85, source: "Google Maps", lastContact: "Hier", value: 1500, onoff: "Client frustré par ses campagnes Ads actuelles. Cherche une solution locale.", seo: "Score Local: 34/100. Fiche GMB non optimisée, site web obsolète." },
                { id: 2, name: "Dupont", company: "Clim Instal Plus", sector: "Climatisation", city: "Paris", phone: "+33 6 52 51 00 33", email: "dir@clim.com", status: "Qualifié", initial: "C", assignee: 4, score: 92, source: "Inbound SEO", lastContact: "Aujourd'hui", value: 5000, onoff: "Le devis lui convient, on signe l'acompte lundi.", seo: "Score Local: 72/100. Présent sur 3 mots-clés, mais conversion faible." },
                { id: 3, name: "Jean D.", company: "AIRFROIDISER", sector: "Climatisation", city: "Marseille", phone: "+33 6 50 78 30 00", email: "jean@airfroidiser.fr", status: "Nouveau lead", initial: "A", assignee: null, score: 45, source: "LinkedIn", lastContact: "Ce Matin", value: 1800, onoff: "Pas encore contacté au téléphone.", seo: "Score Local: 12/100. Totalement invisible sur sa région." },
                { id: 4, name: "Marc S.", company: "D Clim Service", sector: "Climatisation", city: "Toulouse", phone: "+33 6 34 99 15 45", email: "marc@dclim.com", status: "À rappeler", initial: "D", assignee: 1, score: 78, source: "Appel Entrant", lastContact: "Il y a 2 jours", value: 2100, onoff: "Demande à être rappelé la semaine pro, saison calme.", seo: "Score Local: 55/100. Bons avis mais manque de régularité." },
                { id: 5, name: "Luc V.", company: "Vezzoni Immo", sector: "Immobilier", city: "Bordeaux", phone: "+33 6 16 96 52 54", email: "vezzoni.ml@gmail.com", status: "Closer", initial: "V", assignee: 2, score: 95, source: "Recommandation", lastContact: "À l'instant", value: 20000, onoff: "Gros projet Intranet + Site, le contrat est validé verbalement.", seo: "Score Local: 88/100. Leader sur son marché, veut automatiser ses process." },
            ],
            invoices: [
                { id: "DEV-2026-042", type: "Devis", client: "AIRFROIDISER", amount: 1800, status: "Envoyé", date: "18 Mai 2026", details: "Site vitrine one-page" },
                { id: "FAC-2026-001", type: "Facture", client: "Vezzoni Immo", amount: 20000, status: "Payée", date: "10 Mai 2026", details: "Acompte 50% Création Ecosystème" }
            ],
            events: [
                { id: 1, title: "Démo Produit - Clim Instal Plus", date: "Aujourd'hui", time: "14:30", prospectId: 2 },
                { id: 2, title: "Closing - Vezzoni Immo", date: "Demain", time: "10:00", prospectId: 5 }
            ]
        };

        const TEAM_DATA = [
            { id: 1, name: "Hugo A.", role: "Admin", badgeClasses: "bg-blue-500/10 text-blue-400 border-blue-500/20" },
            { id: 2, name: "Kilyan D.", role: "Admin", badgeClasses: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20" },
            { id: 3, name: "Lilou", role: "Setter", badgeClasses: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
            { id: 4, name: "Romain", role: "Closer", badgeClasses: "bg-violet-500/10 text-violet-400 border-violet-500/20" }
        ];

        const state = {
            activeTab: 'Dashboard',
            userRole: 'Admin', // Admin, Closer, Setter
            prospects: [...MOCK_DATA.prospects],
            invoices: [...MOCK_DATA.invoices],
            events: [...MOCK_DATA.events],
            callingStats: { calls: 0, rdv: 0, streak: 0, bestStreak: 0 }, 
            crm: { viewMode: 'kanban', showFilters: false, filters: { sector: '', score: '', value: '' } },
            game: { view: 'home', activeIntro: null, currentStep: 0, choiceMade: null, toast: {show:false, msg:'', icon:''} }
        };

        // --- CORE UTILS ---
        const $ = id => document.getElementById(id);
        function setHTML(id, html) {
            const el = $(id);
            if (el) { el.innerHTML = html; lucide.createIcons({ root: el }); }
        }

        // --- APP LOGIC ---
        window.app = {
            init() {
                this.renderSidebar();
                this.renderView();
            },

            setTab(tabId) {
                state.activeTab = tabId;
                this.renderSidebar();
                this.renderView();
            },

            changeRole(role) {
                state.userRole = role;
                this.renderView();
            },

            closeModal() {
                setHTML('modal-container', '');
            },

            renderSidebar() {
                const navs = [
                    { id: 'Dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
                    { id: 'CRM', icon: 'users', label: 'CRM' },
                    { id: 'Statistiques', icon: 'bar-chart-2', label: 'Statistiques' },
                    { id: 'Agenda', icon: 'calendar', label: 'Agenda' },
                    { id: 'Automatisations', icon: 'zap', label: 'Automatisations' },
                ];

                let html = navs.map(item => `
                    <button onclick="window.app.setTab('${item.id}')" class="w-full flex items-center space-x-4 px-4 py-3 rounded-lg transition-all duration-200 ${state.activeTab === item.id ? 'bg-[#151b2b] text-white shadow-[inset_2px_0_0_#22d3ee]' : 'text-slate-400 hover:text-white hover:bg-[#111623]'}">
                        <i data-lucide="${item.icon}" class="w-5 h-5 ${state.activeTab === item.id ? 'text-cyan-400' : 'text-slate-500'}"></i>
                        <span class="text-sm font-semibold tracking-wide ${state.activeTab === item.id ? 'text-white' : 'text-slate-400'}">${item.label}</span>
                    </button>
                `).join('');

                html += `<div class="my-2 border-b border-[#1a1f2e]"></div>
                <button onclick="window.app.setTab('Facturation')" class="w-full flex items-center space-x-4 px-4 py-3 rounded-lg transition-all duration-200 ${state.activeTab === 'Facturation' ? 'bg-[#151b2b] text-white shadow-[inset_2px_0_0_#22d3ee]' : 'text-slate-400 hover:text-white hover:bg-[#111623]'}">
                    <i data-lucide="receipt" class="w-5 h-5 ${state.activeTab === 'Facturation' ? 'text-cyan-400' : 'text-slate-500'}"></i>
                    <span class="text-sm font-semibold tracking-wide">Facturation</span>
                </button>
                
                <div class="mt-auto pt-8 pb-2">
                    <button onclick="window.app.setTab('Session Calling')" class="w-full py-3.5 rounded-xl flex items-center justify-center text-white font-bold text-sm tracking-wider uppercase transition-all hover:scale-[0.98] shadow-[0_0_20px_rgba(34,211,238,0.15)] ${state.activeTab === 'Session Calling' ? 'bg-gradient-to-r from-cyan-400 to-blue-500 ring-2 ring-cyan-500/50' : 'bg-gradient-to-r from-cyan-500 to-blue-600'}">
                        <i data-lucide="phone-call" class="w-5 h-5 mr-2"></i> SESSION CALLING
                    </button>
                </div>`;

                setHTML('sidebar-nav', html);
                if($('header-loc')) $('header-loc').innerText = state.activeTab;
            },

            renderView() {
                const content = $('app-content');
                content.innerHTML = ''; 

                switch (state.activeTab) {
                    case 'Dashboard': this.renderDashboard(content); break;
                    case 'CRM': this.renderCRM(content); break;
                    case 'Statistiques': this.renderStats(content); break;
                    case 'Agenda': this.renderAgenda(content); break;
                    case 'Facturation': this.renderFacturation(content); break;
                    case 'Automatisations': this.renderAutomations(content); break;
                    case 'Session Calling': this.renderGame(content); break;
                    case 'Paramètres': this.renderSettings(content); break;
                }
                lucide.createIcons({ root: content });
            },

            // --- 1. DASHBOARD ---
            renderDashboard(container) {
                const closedCA = state.prospects.filter(p => p.status === 'Closer').reduce((acc, curr) => acc + curr.value, 0);
                
                let stats = [];
                if (state.userRole === 'Admin') {
                    stats = [
                        { title: "Prospects Actifs", val: state.prospects.length, trend: "up", tVal: "+1", icon: 'target', col: "blue" },
                        { title: "CA Réalisé (Ce Mois)", val: `${closedCA.toLocaleString()} €`, trend: "up", tVal: "14%", icon: 'receipt', col: "emerald" },
                        { title: "Taux de Conversion", val: "24%", trend: "up", tVal: "2.1%", icon: 'crosshair', col: "cyan" },
                        { title: "Appels Globaux", val: "842", trend: "up", tVal: "5%", icon: 'phone', col: "indigo" }
                    ];
                } else if (state.userRole === 'Closer') {
                    stats = [
                        { title: "RDV Réalisés (Mois)", val: "28", trend: "up", tVal: "+4", icon: 'calendar', col: "blue" },
                        { title: "Taux de Transfo", val: "32%", trend: "up", tVal: "5%", icon: 'crosshair', col: "cyan" },
                        { title: "Closings (Ce Mois)", val: "8", trend: "up", tVal: "+2", icon: 'check-circle-2', col: "indigo" },
                        { title: "CA Réalisé", val: `${closedCA.toLocaleString()} €`, trend: "up", tVal: "12%", icon: 'receipt', col: "emerald" }
                    ];
                } else {
                    stats = [
                        { title: "Appels (Aujourd'hui)", val: "142", trend: "up", tVal: "+12", icon: 'phone', col: "blue" },
                        { title: "Taux de Booking", val: "22%", trend: "up", tVal: "4%", icon: 'calendar', col: "emerald" },
                        { title: "RDV Qualifiés", val: "8", trend: "up", tVal: "+2", icon: 'check-circle-2', col: "cyan" },
                        { title: "Temps de parole", val: "4h 12m", trend: "down", tVal: "10m", icon: 'mic', col: "indigo" }
                    ];
                }

                container.innerHTML = `
                <div class="space-y-6">
                    <div class="hud-enter flex justify-between items-end">
                        <div>
                            <h1 class="text-4xl font-black tracking-tight flex items-center text-white">
                                <i data-lucide="layout-dashboard" class="w-8 h-8 mr-3 text-blue-500"></i> DASHBOARD
                            </h1>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${stats.map(s => `
                            <div class="relative bg-slate-900/60 backdrop-blur-2xl p-5 rounded-2xl border border-slate-800 hover:border-cyan-500/30 transition-all duration-300 group overflow-hidden hud-enter">
                                <div class="absolute top-0 right-0 w-32 h-32 bg-${s.col}-500/10 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
                                <div class="relative z-10">
                                    <div class="flex justify-between items-start mb-4">
                                        <div class="p-2.5 rounded-xl bg-slate-800/80 text-${s.col}-400 ring-1 ring-inset ring-${s.col}-500/20 shadow-[0_0_15px_rgba(59,130,246,0.1)]">
                                            <i data-lucide="${s.icon}" class="w-5 h-5"></i>
                                        </div>
                                        <span class="flex items-center text-[10px] font-bold px-2 py-1 rounded-full ${s.trend==='up'?'bg-emerald-500/10 text-emerald-400 border-emerald-500/20':'bg-rose-500/10 text-rose-400 border-rose-500/20'}">
                                            <i data-lucide="arrow-${s.trend}-right" class="w-3 h-3 mr-1"></i> ${s.tVal}
                                        </span>
                                    </div>
                                    <div>
                                        <h3 class="text-3xl font-extrabold text-white tracking-tight mb-1">${s.val}</h3>
                                        <p class="text-xs font-bold tracking-wide text-slate-400 uppercase">${s.title}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 hud-enter" style="animation-delay: 0.1s">
                        <div class="lg:col-span-2 bg-slate-900/60 backdrop-blur-2xl p-6 rounded-2xl border border-slate-800 shadow-2xl relative overflow-hidden">
                            <h3 class="text-sm font-bold tracking-widest text-white uppercase mb-6 flex items-center">
                                <i data-lucide="bar-chart-2" class="w-4 h-4 mr-2 text-blue-500"></i> Pipeline des Ventes Récent
                            </h3>
                            <div class="h-56 w-full flex items-end justify-between px-2 relative">
                                <div class="absolute inset-0 grid grid-rows-4 gap-0 pointer-events-none border-b border-slate-800">
                                    <div class="border-t border-slate-800/50 w-full h-full"></div>
                                    <div class="border-t border-slate-800/50 w-full h-full"></div>
                                    <div class="border-t border-slate-800/50 w-full h-full"></div>
                                    <div class="border-t border-slate-800/50 w-full h-full"></div>
                                </div>
                                ${[{h:30,d:'Lun'},{h:50,d:'Mar'},{h:40,d:'Mer'},{h:70,d:'Jeu'},{h:60,d:'Ven'},{h:90,d:'Sam'},{h:80,d:'Dim'}].map(bar => `
                                    <div class="relative group w-12 flex flex-col items-center justify-end h-full">
                                        <div class="w-full bg-gradient-to-t from-blue-600 to-cyan-400 rounded-t-md opacity-80 transition-all shadow-[0_0_20px_rgba(56,189,248,0.3)]" style="height:${bar.h}%"></div>
                                        <span class="text-[10px] font-bold text-slate-500 mt-2 uppercase">${bar.d}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="bg-slate-900/60 backdrop-blur-2xl p-6 rounded-2xl border border-slate-800 shadow-2xl">
                            <h3 class="text-sm font-bold tracking-widest text-white uppercase mb-4 flex items-center">
                                <i data-lucide="bot" class="w-4 h-4 mr-2 text-cyan-500"></i> Activité IA & Workflows
                            </h3>
                            <div class="space-y-4">
                                ${[{t:"Transcription appel", s:"Terminé", c:"text-emerald-400"},{t:"Séquence Nurturing", s:"Actif", c:"text-blue-400"}].map(log => `
                                    <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-1">
                                            <span class="text-xs font-extrabold text-white">Jarvis Bot</span>
                                            <span class="text-[10px] font-bold text-slate-500">Maintenant</span>
                                        </div>
                                        <div class="flex justify-between items-center">
                                            <span class="text-xs font-medium text-slate-400">${log.t}</span>
                                            <span class="text-[9px] font-black uppercase ${log.c} bg-slate-900 px-2 py-0.5 rounded border border-slate-700">${log.s}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            // --- 2. CRM ---
            setCRMViewMode(mode) { state.crm.viewMode = mode; this.renderView(); },
            toggleCRMFilters() { state.crm.showFilters = !state.crm.showFilters; this.renderView(); },

            openProspectModal(id) {
                const p = state.prospects.find(x => x.id === id);
                if (!p) return;

                const html = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-[#0B0F19]/80 backdrop-blur-sm fade-in" onclick="window.app.closeModal()">
                    <div class="bg-slate-900 rounded-2xl shadow-2xl w-[750px] max-h-[90vh] overflow-y-auto border border-slate-700 overflow-hidden hud-enter" onclick="event.stopPropagation()">
                        <div class="px-6 py-5 border-b border-slate-800 flex justify-between items-center bg-slate-900 sticky top-0 z-10">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 rounded-xl bg-slate-800 text-cyan-400 flex items-center justify-center font-black text-xl border border-slate-700">${p.initial}</div>
                                <div>
                                    <h2 class="font-black text-white text-lg tracking-tight">${p.company}</h2>
                                    <span class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest">${p.status}</span>
                                </div>
                            </div>
                            <button onclick="window.app.closeModal()" class="text-slate-400 hover:text-white p-2 bg-slate-800 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="p-6 space-y-6">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Contact Principal</p>

                        ${isAdmin ? `
                        <div class="mt-6 pt-6 border-t border-slate-800 flex gap-4">

                    </div>
                `;

                if (isAdmin) {
                    html += `
                    <div class="bg-slate-900/60 p-8 rounded-2xl border border-slate-800 shadow-2xl hud-enter" style="animation-delay: 0.2s">
                        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
                            <h2 class="text-xl text-white font-bold flex items-center"><i data-lucide="briefcase" class="w-5 h-5 mr-2 text-blue-500"></i> Offres & Packs</h2>
                            <button class="text-cyan-400 text-sm font-bold flex items-center hover:text-cyan-300 bg-cyan-500/10 px-3 py-1.5 rounded-lg border border-cyan-500/20"><i data-lucide="plus" class="w-4 h-4 mr-1"></i> Ajouter une offre</button>
                        </div>
                        <div class="grid grid-cols-3 gap-6">
                            <div class="bg-[#0B0F19] p-6 rounded-xl border border-slate-700 relative">
                                <h3 class="text-4xl font-black text-cyan-400 mb-1">1 800€</h3>
                                <p class="text-slate-400 text-xs mb-6 pb-4 border-b border-slate-800">Prix de création<br><span class="text-white mt-1 block font-bold">Puis 150€/mois</span></p>
                                <ul class="space-y-3 text-sm text-slate-300 mb-8 font-medium">
                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-blue-500 mr-2 mt-0.5 shrink-0"></i> Site Vitrine Premium 1 à 5 pages</li>
                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-blue-500 mr-2 mt-0.5 shrink-0"></i> Optimisation Google Business Profile</li>
                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-blue-500 mr-2 mt-0.5 shrink-0"></i> Référencement Local SEO</li>
                                </ul>
                                <button class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition-colors">Modifier</button>
                            </div>
                            <div class="bg-[#0B0F19] p-6 rounded-xl border border-blue-500/50 relative shadow-[0_0_20px_rgba(59,130,246,0.15)] transform scale-105">
                                <h3 class="text-4xl font-black text-blue-400 mb-1">5 000€</h3>
                                <p class="text-slate-400 text-xs mb-6 pb-4 border-b border-slate-800">Prix de création<br><span class="text-white mt-1 block font-bold">Puis 400€/mois</span></p>
                                <ul class="space-y-3 text-sm text-slate-300 mb-8 font-medium">
                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-cyan-400 mr-2 mt-0.5 shrink-0"></i> Site Web d'Acquisition + Stratégie SEO</li>
                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-cyan-400 mr-2 mt-0.5 shrink-0"></i> Solution Intranet / CRM sur-mesure</li>
                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-cyan-400 mr-2 mt-0.5 shrink-0"></i> Automatisation des devis & Agenda</li>
                                </ul>
                                <button class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition-colors shadow-lg">Modifier</button>
                            </div>
                            <div class="bg-[#0B0F19] p-6 rounded-xl border border-slate-700 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-24 h-24 bg-purple-500/20 blur-2xl"></div>
                                <h3 class="text-4xl font-black text-purple-400 mb-1 relative z-10">20 000€</h3>
                                <p class="text-slate-400 text-xs mb-6 pb-4 border-b border-slate-800 relative z-10">Prix de création<br><span class="text-white mt-1 block font-bold">Puis 1 500€/mois</span></p>
                                <ul class="space-y-3 text-sm text-slate-300 mb-8 font-medium relative z-10">

                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-purple-400 mr-2 mt-0.5 shrink-0"></i> Intranet Avancé & Automatisation totale</li>
                                    <li class="flex items-start"><i data-lucide="check" class="w-4 h-4 text-purple-400 mr-2 mt-0.5 shrink-0"></i> API sur-mesure</li>

                                <button class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold uppercase tracking-wider transition-colors relative z-10">Modifier</button>

                html += `</div>`;
                container.innerHTML = html;
            },

            // --- 8. SESSION CALLING (GAME INTEGRATION) ---
            gameShowToast(icon, msg) {
                state.game.toast = { show: true, icon, msg };
                this.renderView();
                setTimeout(() => { state.game.toast.show = false; this.renderView(); }, 2800);
            },
            gameStart() { state.game.view = 'intros'; this.renderView(); },
            gameHome() { state.game.view = 'home'; this.renderView(); },
            gameLaunch(idx) { state.game.activeIntro = INTROS[idx]; state.game.currentStep = 0; state.game.choiceMade = null; state.game.view = 'call'; this.renderView(); },
            gameSelectChoice(idx) {
                state.game.choiceMade = state.game.activeIntro.steps[state.game.currentStep].choices[idx];
                this.renderView();
                setTimeout(() => { const c = $('call-scroll'); if(c) c.scrollTop = c.scrollHeight; }, 50);
            },
            gameNext() { if (state.game.currentStep < state.game.activeIntro.steps.length - 1) { state.game.currentStep++; state.game.choiceMade = null; this.renderView(); } },
            gamePrev() { if (state.game.currentStep > 0) { state.game.currentStep--; state.game.choiceMade = null; this.renderView(); } },
            gameEnd(isRdv) {
                const s = state.callingStats;
                s.calls++;
                if (isRdv) { s.rdv++; s.streak++; if(s.streak>s.bestStreak) s.bestStreak=s.streak; } else { s.streak = 0; }
                state.game.view = 'outcome';
                this.renderView();
            },

            renderGame(container) {
                const g = state.game;
                const s = state.callingStats;
                const rate = s.calls === 0 ? '—' : Math.round((s.rdv/s.calls)*100)+'%';

                let html = `<div class="h-full w-full bg-[#050505] rounded-2xl border border-slate-800 shadow-2xl overflow-hidden relative flex flex-col font-sans game-wrapper">`;
                if (g.toast.show) html += `<div class="absolute bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 border border-cyan-500/50 rounded-xl px-6 py-3 flex items-center shadow-2xl z-50 fade-in"><span class="text-xl mr-3">${g.toast.icon}</span><span class="text-sm font-bold text-white whitespace-nowrap">${g.toast.msg}</span></div>`;

                const statsBar = `
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/80 shrink-0">
                    <div class="flex space-x-3">
                        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5"><span class="text-cyan-400 mr-2 text-sm">📞</span><span class="text-xs font-bold text-white">${s.calls} appels</span></div>
                        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5"><span class="text-emerald-400 mr-2 text-sm">✅</span><span class="text-xs font-bold text-white">${s.rdv} RDV</span></div>
                        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5"><span class="text-orange-400 mr-2 text-sm">🔥</span><span class="text-xs font-bold text-white">×${s.streak}</span></div>
                    </div>
                </div>`;

                if (g.view === 'home') {
                    html += `<div class="flex-1 flex flex-col items-center justify-center p-10 text-center fade-in">
                        <p class="text-[10px] font-bold tracking-[0.35em] uppercase text-cyan-400 mb-3">Delthom Agency OS</p>
                        <h1 class="text-6xl font-serif text-white leading-tight mb-4 tracking-tight">Setting<br><em class="text-cyan-400 not-italic">Ultime.</em></h1>
                        <p class="text-sm text-slate-400 font-light mb-12 max-w-md leading-relaxed">Prompteur interactif. Lis, clique sur sa réponse, rebondis, et verrouille tes RDVs.</p>
                        <button onclick="window.app.gameStart()" class="px-8 py-4 bg-gradient-to-r from-cyan-400 to-blue-600 text-white rounded-2xl font-bold text-lg hover:scale-95 transition-transform shadow-[0_0_30px_rgba(34,211,238,0.3)]">📞 Lancer un appel</button>
                    </div>`;
                } else if (g.view === 'intros') {
                    html += `<div class="flex-1 flex flex-col fade-in">${statsBar}
                        <div class="px-6 py-5 border-b border-slate-800 flex items-center">
                            <button onclick="window.app.gameHome()" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-white hover:bg-slate-800 mr-4"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                            <div><p class="text-[9px] font-bold tracking-[0.25em] uppercase text-cyan-400 mb-1">Étape 1 sur 2</p><p class="text-base font-bold text-white">Choisis ton Icebreaker</p></div>

                        <div class="flex-1 overflow-y-auto p-6 space-y-3 custom-scrollbar">

                        </div>
                    </div>`;
                } else if (g.view === 'call' && g.activeIntro) {
                    const step = g.activeIntro.steps[g.currentStep];

                    html += `<div class="flex-1 flex flex-col fade-in">${statsBar}
                        <div class="px-6 py-4 border-b border-slate-800 flex items-center bg-slate-900/50">

                            <div class="flex-1 min-w-0"><p class="text-[9px] font-bold tracking-[0.25em] uppercase text-cyan-400 mb-1">${step.phase}</p><p class="text-sm text-slate-400 truncate">${g.activeIntro.name}</p></div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-6 flex flex-col pb-10 custom-scrollbar" id="call-scroll">
                            <div class="fade-in"><p class="text-[9px] font-bold tracking-[0.28em] uppercase text-cyan-400 mb-4 flex items-center"><span class="w-4 h-px bg-cyan-400 mr-3"></span>${step.phase}</p><div class="font-serif text-[22px] leading-relaxed text-white">${step.text}</div></div>
                            <div class="mt-8 space-y-3 flex flex-col pb-6">
                                ${!g.choiceMade ? (step.choices ? step.choices.map((c, i) => `<button onclick="window.app.gameSelectChoice(${i})" class="bg-slate-900 border border-slate-800 hover:bg-cyan-500/10 hover:border-cyan-500/30 p-4 rounded-xl text-left text-white text-sm font-medium transition-all flex items-center"><span class="text-cyan-400 text-xl mr-3 leading-none mb-1">↳</span> ${c.label}</button>`).join('') : '') : `<div class="fade-in"><div class="bg-[#0f0f11] border-l-4 border-slate-600 p-4 rounded-r-xl rounded-bl-xl mt-4 text-[15px] text-slate-400 italic"><strong class="not-italic text-[10px] font-bold tracking-wider uppercase text-white block mb-2">La réponse du Prospect</strong>${g.choiceMade.prospect}</div>${g.choiceMade.reply ? `<div class="bg-[#12141f] border-l-4 border-cyan-400 p-5 rounded-r-xl rounded-bl-xl mt-4 font-serif text-[21px] text-white"><strong class="font-sans text-[10px] font-bold tracking-wider uppercase text-cyan-500 block mb-2">Ton Reframe (À lire)</strong><span>${g.choiceMade.reply}</span></div>` : ''}</div>`}
                            </div>
                        </div>
                        <div class="px-6 py-5 border-t border-slate-800 flex gap-3 shrink-0 bg-[#050505]">
                            ${g.currentStep > 0 ? `<button onclick="window.app.gamePrev()" class="w-14 bg-slate-900 border border-slate-800 text-slate-400 rounded-xl flex items-center justify-center hover:bg-slate-800"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>` : ''}
                            ${(!step.choices || g.choiceMade) ? ((isLast || step.final) ? `<div class="flex-1 flex flex-col space-y-2"><button onclick="window.app.gameEnd(true)" class="w-full py-4 bg-emerald-500 text-white rounded-xl font-bold text-sm hover:bg-emerald-600">✅ RDV pris !</button><button onclick="window.app.gameEnd(false)" class="w-full py-3 bg-slate-900 border border-slate-800 text-slate-400 rounded-xl font-bold text-sm hover:bg-slate-800">✗ Pas intéressé</button></div>` : `<button onclick="window.app.gameNext()" class="flex-1 bg-gradient-to-r from-cyan-400 to-blue-600 text-white rounded-xl font-bold text-sm shadow-[0_0_15px_rgba(34,211,238,0.2)]">Continuer →</button>`) : `<div class="flex-1 flex items-center justify-center text-[13px] text-slate-500 italic">Attente de la réponse du prospect...</div>`}
                        </div>
                    </div>`;
                } else if (g.view === 'outcome') {
                    html += `<div class="flex-1 flex flex-col items-center justify-center p-10 text-center fade-in">
                        <div class="text-7xl mb-6">${s.streak > 0 ? '🏆' : '💪'}</div>
                        <h2 class="font-serif text-5xl text-white mb-3 leading-tight">${s.streak > 0 ? '<em>RDV</em><br>décroché !' : 'Continue,<br><em>reste en jeu.</em>'}</h2>
                        <div class="flex flex-col w-full max-w-sm space-y-3 mt-10">
                            <button onclick="window.app.gameStart()" class="w-full py-4 bg-gradient-to-r from-cyan-400 to-blue-600 text-white rounded-xl font-bold text-sm shadow-[0_0_15px_rgba(34,211,238,0.2)]">📞 Prochain appel</button>
                            <button onclick="window.app.gameHome()" class="w-full py-4 bg-slate-900 border border-slate-800 text-slate-400 rounded-xl font-bold text-sm hover:bg-slate-800">← Retour accueil</button>

                html += `</div>`;
                container.innerHTML = html;
            }
        };

        document.addEventListener('DOMContentLoaded', () => { window.app.init(); });
    </script>
